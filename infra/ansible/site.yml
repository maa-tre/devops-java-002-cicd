---
- name: Configure the DevOps demo EC2 host
  hosts: all
  become: true

  vars:
    deployment_dir: /opt/devops-java-002
    db_name: studentdb
    db_user: postgres
    app_db_user: java_app

  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
        fail_msg: "This playbook supports Ubuntu EC2 hosts."

    - name: Generate persistent database credentials on the Ansible controller
      ansible.builtin.set_fact:
        postgres_password: >-
          {{ lookup('ansible.builtin.password',
          playbook_dir + '/.postgres_password length=40 chars=ascii_letters,digits') }}
        app_db_password: >-
          {{ lookup('ansible.builtin.password',
          playbook_dir + '/.app_db_password length=40 chars=ascii_letters,digits') }}
        rollback_pin: >-
          {{ lookup('ansible.builtin.password',
          playbook_dir + '/.rollback_pin length=8 chars=digits') }}
        rollback_agent_token: >-
          {{ lookup('ansible.builtin.password',
          playbook_dir + '/.rollback_agent_token length=64 chars=ascii_letters,digits') }}
      no_log: true

    - name: Restrict generated secret files on the Ansible controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        mode: "0600"
      loop:
        - "{{ playbook_dir }}/.postgres_password"
        - "{{ playbook_dir }}/.app_db_password"
        - "{{ playbook_dir }}/.rollback_pin"
        - "{{ playbook_dir }}/.rollback_agent_token"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Hash rollback PIN on the Ansible controller
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/generate-rollback-pin-hash.py"
        stdin: "{{ rollback_pin }}"
      delegate_to: localhost
      become: false
      register: rollback_pin_hash_result
      changed_when: false
      no_log: true

    - name: Store hashed rollback PIN for host deployment
      ansible.builtin.set_fact:
        rollback_pin_hash: "{{ rollback_pin_hash_result.stdout }}"
      no_log: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add the Ubuntu login user to the Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create the deployment directory
      ansible.builtin.file:
        path: "{{ deployment_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0750"

    - name: Install restricted rollback helper
      ansible.builtin.copy:
        src: ../scripts/rollback-agent.py
        dest: "{{ deployment_dir }}/rollback-agent.py"
        owner: root
        group: root
        mode: "0755"

    - name: Create rollback helper secret directory
      ansible.builtin.file:
        path: /etc/devops-java-002
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create persistent rollback request state directory
      ansible.builtin.file:
        path: /var/lib/devops-java-002/rollback-requests
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Read Docker host gateway address
      ansible.builtin.command:
        cmd: docker network inspect bridge
      register: docker_host_gateway_result
      changed_when: false

    - name: Set Docker host gateway address
      ansible.builtin.set_fact:
        docker_host_gateway: "{{ (docker_host_gateway_result.stdout | from_json)[0].IPAM.Config[0].Gateway }}"

    - name: Install rollback helper secret
      ansible.builtin.template:
        src: templates/rollback-agent.env.j2
        dest: /etc/devops-java-002/rollback-agent.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart rollback helper

    - name: Install rollback helper systemd service
      ansible.builtin.template:
        src: templates/rollback-agent.service.j2
        dest: /etc/systemd/system/devops-java-002-rollback-agent.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart rollback helper

    - name: Install application deployment script
      ansible.builtin.copy:
        src: ../scripts/deploy-app.sh
        dest: "{{ deployment_dir }}/deploy-app.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Install PostgreSQL Compose configuration
      ansible.builtin.template:
        src: templates/compose.yaml.j2
        dest: "{{ deployment_dir }}/compose.yaml"
        owner: ubuntu
        group: ubuntu
        mode: "0640"
      register: compose_config

    - name: Install PostgreSQL environment file
      ansible.builtin.template:
        src: templates/database.env.j2
        dest: "{{ deployment_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: database_env

    - name: Start PostgreSQL and wait for its health check
      ansible.builtin.command:
        cmd: docker compose up --detach --wait
        chdir: "{{ deployment_dir }}"
      register: compose_up
      changed_when: >-
        'Created' in compose_up.stdout or
        'Recreated' in compose_up.stdout or
        'Started' in compose_up.stdout

    - name: Confirm the PostgreSQL service is running
      ansible.builtin.command:
        cmd: docker compose ps --status running --services
        chdir: "{{ deployment_dir }}"
      register: running_services
      changed_when: false
      failed_when: "'db-service' not in running_services.stdout_lines"

    - name: Provision the least-privilege application database role
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --interactive
          - postgres_db
          - psql
          - --set=ON_ERROR_STOP=1
          - --username
          - "{{ db_user }}"
          - --dbname
          - "{{ db_name }}"
        stdin: |
          DO $role$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ app_db_user }}') THEN
              CREATE ROLE {{ app_db_user }} LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{ app_db_password }}';
            ELSE
              ALTER ROLE {{ app_db_user }} WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{ app_db_password }}';
            END IF;
          END;
          $role$;
          GRANT CONNECT ON DATABASE {{ db_name }} TO {{ app_db_user }};
          GRANT USAGE ON SCHEMA public TO {{ app_db_user }};
      no_log: true
      changed_when: true

    - name: Create rollback request history table
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --interactive
          - postgres_db
          - psql
          - --set=ON_ERROR_STOP=1
          - --username
          - "{{ db_user }}"
          - --dbname
          - "{{ db_name }}"
        stdin: |
          CREATE TABLE IF NOT EXISTS rollback_requests (
            id uuid PRIMARY KEY,
            target_image varchar(100) NOT NULL,
            previous_image varchar(100),
            status varchar(20) NOT NULL,
            phase varchar(40) NOT NULL,
            message varchar(500) NOT NULL,
            requested_at timestamp with time zone NOT NULL,
            completed_at timestamp with time zone
          );
          GRANT SELECT, INSERT, UPDATE ON TABLE rollback_requests TO {{ app_db_user }};
      no_log: true
      changed_when: true

    - name: Install application PostgreSQL environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ deployment_dir }}/app.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart rollback helper

    - name: Enable and start rollback helper
      ansible.builtin.systemd:
        name: devops-java-002-rollback-agent
        daemon_reload: true
        state: started
        enabled: true

  handlers:
    - name: Restart rollback helper
      ansible.builtin.systemd:
        name: devops-java-002-rollback-agent
        daemon_reload: true
        state: restarted

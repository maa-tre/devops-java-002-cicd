services:
  db-service:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-studentdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-studentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/create-app-db-role.sh"]
    environment:
      PGHOST: db-service
      PGDATABASE: ${DB_NAME:-studentdb}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored .env file}
      APP_DB_USER: ${APP_DB_USER:-java_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the ignored .env file}
    volumes:
      - ./infra/scripts/create-app-db-role.sh:/scripts/create-app-db-role.sh:ro
    networks:
      - private-net
    depends_on:
      db-service:
        condition: service_healthy

  backend-api: 
    build: .
    container_name: spring_backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-service:5432/${DB_NAME:-studentdb}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-java_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the ignored .env file}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    networks:
      - private-net
    depends_on:
      db-init:
        condition: service_completed_successfully

networks:
  private-net:
    name: private-net
    driver: bridge

volumes:
  postgres_data:
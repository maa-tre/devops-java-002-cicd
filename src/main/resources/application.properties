spring.application.name=devoopsclass

# Default to an embedded H2 database for local runs without Docker.
# You can still override these values with environment variables if you want PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:devoopsclass;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false